name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove secrets and private repository data before submitting.
  - type: input
    id: version
    attributes:
      label: PR Rigor version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [GitHub Action, CLI, library API]
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      render: json
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include minimized PR metadata, paths, and patches with secrets removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
