name: False positive
description: Report a rule that fired on safe or expected behavior
title: "false positive: "
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: missing-tests
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Changed paths and minimized evidence
      description: Remove credentials and private source.
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      render: json
  - type: textarea
    id: reason
    attributes:
      label: Why the finding is incorrect or unhelpful
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested deterministic distinction
